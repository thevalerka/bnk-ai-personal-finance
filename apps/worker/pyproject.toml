[project]
name = "amt-worker"
version = "0.1.0"
description = "Adaptive Markets Terminal — background workers"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10",
    "pydantic-settings>=2.15",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest>=9.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
