name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
        working-directory: apps/api
      - run: ruff check .
        working-directory: apps/api
      - run: mypy app
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api

  worker:
    name: worker (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
        working-directory: apps/worker
      - run: ruff check .
        working-directory: apps/worker
      - run: mypy app
        working-directory: apps/worker
      - run: pytest -q
        working-directory: apps/worker

  web:
    name: web (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
