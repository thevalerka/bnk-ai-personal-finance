# Capability -> ordered provider fallback chain. The Router tries providers
# left to right, skipping ones that are out of budget or that error out.
# See docs/PLAN.md section 3.2 for why each provider is paired the way it is.

equity_quote:
  - finnhub
  - alpaca

crypto_quote:
  - binance
  - hyperliquid

macro_series:
  - fred

# candles/news/calendar chains are per-provider capability, not fallback
# alternatives to each other — each provider offers exactly one of these,
# so chains are single-entry until a second candle/news/calendar source is
# added (see apps/api/app/market/providers/*.py capability notes).

equity_candles:
  - alpaca

crypto_candles:
  - binance
  - hyperliquid

macro_candles:
  - fred

equity_news:
  - finnhub

earnings_calendar:
  - finnhub

macro_calendar:
  - fred
