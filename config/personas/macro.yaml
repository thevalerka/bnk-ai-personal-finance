# Seeded interest vector for the "View as" switcher (docs/PLAN.md section
# 1 + 4.4). Events replay through the real decay pipeline
# (app/attention/personas.py -> service.record_event), oldest first — this
# is a script of what a rates-obsessed user's week would actually look like,
# not a hand-tuned final score.
name: macro
label: Macro
description: Lives in the belly of the curve, watches Fed policy and cross-asset vol.
events:
  - {node_id: fixed_income.rates_ust.long_end, kind: search, days_ago: 6}
  - {node_id: fixed_income.rates_ust.long_end, kind: click, days_ago: 6}
  - {node_id: fixed_income.rates_ust.belly, kind: click, days_ago: 5}
  - {node_id: fixed_income.rates_ust.belly, kind: chart_interaction, days_ago: 4}
  - {node_id: fixed_income.rates_ust.short_end, kind: hover, days_ago: 4}
  - {node_id: macro.cross_asset.fed_policy, kind: search, days_ago: 3}
  - {node_id: macro.cross_asset.fed_policy, kind: agent_mention, days_ago: 2}
  - {node_id: fixed_income.rates_ust.long_end, kind: click, days_ago: 2}
  - {node_id: macro.cross_asset.volatility, kind: hover, days_ago: 1}
  - {node_id: fixed_income.rates_ust.belly, kind: pin, days_ago: 1}
  - {node_id: equities.us_large_cap.broad_market, kind: impression, days_ago: 0}
