# Per-provider free-tier call budgets, enforced by BudgetManager as a
# fixed-window counter in Redis. These are conservative approximations of
# each vendor's published free-tier limits (docs/PLAN.md section 3.2) —
# verify against the vendor's current docs before raising them.

finnhub:
  capacity: 60
  window_seconds: 60

alpaca:
  capacity: 200
  window_seconds: 60

binance:
  capacity: 1200
  window_seconds: 60

hyperliquid:
  capacity: 100
  window_seconds: 60

fred:
  capacity: 120
  window_seconds: 60

# Keyless government sources — no published rate limit, so these are
# self-imposed good-citizen caps (matching sources.yaml's declared
# budgets), not a documented vendor tier like the others above.
federal_reserve:
  capacity: 60
  window_seconds: 3600

treasury:
  capacity: 120
  window_seconds: 60

regional_feds:
  capacity: 60
  window_seconds: 3600

# SEC asks for <=10 req/s; each news() call fans out to 10 companies
# (one request each), issued sequentially, well under that ceiling.
sec_edgar:
  capacity: 60
  window_seconds: 60

rss_media:
  capacity: 60
  window_seconds: 3600

# Matches sources.yaml's declared vendor budget. probability() fans out to
# 3 requests per call (paginated), well under this.
polymarket:
  capacity: 120
  window_seconds: 60
